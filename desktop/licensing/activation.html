<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KP Master · Client Activation</title><style>
*{box-sizing:border-box}body{margin:0;font:15px 'Segoe UI','Nirmala UI',sans-serif;background:#f2f5f8;color:#18374e;min-height:100vh;display:grid;place-items:center}.card{width:min(620px,92vw);padding:30px;background:#fff;border:1px solid #d2dde5;border-radius:14px;box-shadow:0 8px 35px #1d3e5310}.brand{font-size:12px;letter-spacing:2px;color:#71808d}h1{font-size:26px;margin:9px 0 10px}p{line-height:1.55;color:#536676}label{display:block;font-weight:600;margin-top:20px}input{margin:8px 0 10px;width:100%;padding:13px 10px;border:1px solid #9fb4c3;border-radius:7px;font:15px Consolas,monospace;color:#154360;background:#f7fafb;text-align:center}button{padding:10px 14px;border:1px solid #b4c7d4;border-radius:6px;color:#234b68;background:#fff;cursor:pointer}button.primary{background:#1f5b7d;border-color:#1f5b7d;color:#fff}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{min-height:28px;font-size:13px;margin-top:17px;color:#9b391c}.note{font-size:12px;border-top:1px solid #e2e8ed;padding-top:15px;margin-bottom:0}select{float:right;border:1px solid #c9d7df;border-radius:4px;padding:4px;background:white;color:#234b68}</style></head><body><main class="card"><select id="language" aria-label="Language"><option value="en">English</option><option value="mr">मराठी</option></select><div class="brand">KP MASTER</div><h1 id="heading">Activate this computer</h1><p id="instructions">Send your System ID to the software owner. Import the license file they issue for this computer.</p><label id="id-label" for="system-id">System ID</label><input id="system-id" readonly value="Checking…"><div class="actions"><button id="copy" disabled>Copy ID</button><button id="export" disabled>Save ID</button><button id="activate" class="primary" disabled>Import activation license</button><button id="close">Close</button></div><div id="status" class="status" role="status"></div><p id="note" class="note">Once activated, calculations and reports work offline. A
